rule: execution/proc_creation_powershell_encoded.yml
atomic_test: T1059.001 / f5c1f6fa (Mimikatz -enc), redcanaryco atomic-red-team
true_positives:
  - name: powershell -enc with base64 blob
    event:
      EventID: 1
      Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
      OriginalFileName: 'PowerShell.EXE'
      CommandLine: 'powershell.exe -nop -w hidden -enc SQBFAFgAKABOAGUAdwAtAE8AYgBqAGUAYwB0AA=='
      ParentImage: 'C:\Windows\System32\cmd.exe'
  - name: renamed binary detected via OriginalFileName
    event:
      EventID: 1
      Image: 'C:\Users\Public\svchost.exe'
      OriginalFileName: 'PowerShell.EXE'
      CommandLine: 'svchost.exe -ec ZQBjAGgAbwAgAGgAaQA='
true_negatives:
  - name: benign policy-bypass script run
    event:
      EventID: 1
      Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
      OriginalFileName: 'PowerShell.EXE'
      CommandLine: 'powershell.exe -ExecutionPolicy Bypass -File C:\scripts\nightly-backup.ps1'
  - name: cmd echoing the word enc is not powershell
    event:
      EventID: 1
      Image: 'C:\Windows\System32\cmd.exe'
      OriginalFileName: 'Cmd.Exe'
      CommandLine: 'cmd.exe /c echo encode this'
