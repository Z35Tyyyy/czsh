title: Active Directory Reconnaissance via Built-in Tools
id: 6f2a1b30-9a1e-4c8d-9d21-0a1b2c3d4e13
status: experimental
description: >
  Detects domain reconnaissance performed with living-off-the-land tools: net
  group/user queries against the domain, nltest trust and DC enumeration, and
  dsquery. This activity typically follows initial access as an operator maps
  privileged accounts and domain trusts before moving laterally. Local (non-
  domain) net queries are excluded to keep the signal high.
references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://attack.mitre.org/techniques/T1482/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1087.002/T1087.002.md
author: Kanishk Singh
date: 2026/07/10
tags:
  - attack.discovery
  - attack.t1087.002
  - attack.t1482
logsource:
  product: windows
  category: process_creation
detection:
  selection_net_domain:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
    CommandLine|contains|all:
      - 'group'
      - '/domain'
  selection_net_admins:
    CommandLine|contains: 'domain admins'
  selection_nltest:
    Image|endswith: '\nltest.exe'
    CommandLine|contains:
      - '/domain_trusts'
      - '/dclist'
      - '/all_trusts'
  selection_dsquery:
    Image|endswith: '\dsquery.exe'
  condition: 1 of selection_*
falsepositives:
  - Administrators and directory tools legitimately query AD. Volume and sequence
    (many discovery commands from one host in minutes) are the real signal;
    correlate rather than alert on a single benign query.
level: medium
