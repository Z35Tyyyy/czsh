title: Process Execution via WMIC process call create
id: 6f2a1b30-9a1e-4c8d-9d21-0a1b2c3d4e02
status: experimental
description: >
  Detects use of WMIC to spawn a new process via "process call create". This is a
  common living-off-the-land execution and lateral-movement technique because it
  runs the child process under WmiPrvSE, breaking the normal parent/child chain
  and evading detections that pivot on process ancestry.
references:
  - https://attack.mitre.org/techniques/T1047/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1047/T1047.md
author: Kanishk Singh
date: 2026/07/10
tags:
  - attack.execution
  - attack.t1047
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\WMIC.exe'
    CommandLine|contains|all:
      - 'process'
      - 'call'
      - 'create'
  condition: selection
falsepositives:
  - Legitimate software deployment or administrative scripts. Tune by allow-listing
    the specific remote hosts / accounts used by your management tooling.
level: medium
