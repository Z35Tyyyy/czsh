title: PowerShell EncodedCommand Execution
id: 6f2a1b30-9a1e-4c8d-9d21-0a1b2c3d4e01
status: experimental
description: >
  Detects PowerShell (powershell.exe / pwsh.exe) invoked with an encoded-command
  flag (-EncodedCommand / -enc / -ec). Attackers use Base64-encoded payloads to
  hide script contents from casual log inspection and to sidestep naive string
  detections. Matching on OriginalFileName as well as Image also catches the
  binary being renamed to evade image-name detections.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1059.001/T1059.001.md
author: Kanishk Singh
date: 2026/07/10
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    - Image|endswith:
        - '\powershell.exe'
        - '\pwsh.exe'
    - OriginalFileName:
        - 'PowerShell.EXE'
        - 'pwsh.dll'
  selection_flag:
    CommandLine|contains:
      - ' -enc'
      - ' -ec '
      - ' -encodedcommand'
  condition: selection_img and selection_flag
falsepositives:
  - Some legitimate remote-management and deployment tools pass encoded commands.
    Tune by allow-listing known parent processes or signed script hosts.
level: high
