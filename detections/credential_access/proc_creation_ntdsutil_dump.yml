title: Active Directory Database Dump via ntdsutil
id: 6f2a1b30-9a1e-4c8d-9d21-0a1b2c3d4e06
status: experimental
description: >
  Detects use of ntdsutil to create an Install-From-Media (IFM) copy of the
  NTDS.dit Active Directory database. On a domain controller this hands an
  attacker every domain credential hash at once, making it one of the highest
  impact credential-access actions. Legitimate use is limited to DC promotion and
  planned backups.
references:
  - https://attack.mitre.org/techniques/T1003/003/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1003.003/T1003.003.md
author: Kanishk Singh
date: 2026/07/10
tags:
  - attack.credential_access
  - attack.t1003.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_bin:
    Image|endswith: '\ntdsutil.exe'
  selection_cmd:
    CommandLine|contains:
      - 'create full'
      - 'ifm'
      - 'ac i ntds'
  condition: selection_bin and selection_cmd
falsepositives:
  - Sanctioned domain-controller backups or DC promotion. Confirm the operation
    was change-managed and initiated by an administrator.
level: high
