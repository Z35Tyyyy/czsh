title: LSASS Memory Dump for Credential Theft
id: 6f2a1b30-9a1e-4c8d-9d21-0a1b2c3d4e04
status: test
description: >
  Detects attempts to dump the memory of LSASS, the process that holds cached
  credentials and secrets. Covers two of the most common techniques: ProcDump
  with the -ma (full dump) flag against lsass, and the built-in comsvcs.dll
  MiniDump export invoked through rundll32. A successful LSASS dump typically
  precedes credential reuse and lateral movement.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1003.001/T1003.001.md
author: Kanishk Singh
date: 2026/07/10
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_procdump:
    Image|endswith: '\procdump.exe'
    CommandLine|contains: 'lsass'
  selection_comsvcs:
    CommandLine|contains|all:
      - 'comsvcs.dll'
      - 'minidump'
  selection_taskmgr_syntax:
    CommandLine|contains|all:
      - 'rundll32'
      - 'lsass'
      - 'full'
  condition: 1 of selection_*
falsepositives:
  - Legitimate crash-dump collection by monitoring agents. Verify the parent
    process and the destination path of the dump file.
level: high
