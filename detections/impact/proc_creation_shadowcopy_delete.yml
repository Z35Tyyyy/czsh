title: Shadow Copy Deletion / Recovery Inhibition
id: 6f2a1b30-9a1e-4c8d-9d21-0a1b2c3d4e14
status: stable
description: >
  Detects deletion of Volume Shadow Copies and tampering with Windows recovery,
  via vssadmin, wmic shadowcopy, wbadmin, or bcdedit. This is the near-universal
  pre-encryption step in ransomware playbooks: destroying backups and disabling
  recovery so victims cannot roll back. Very high fidelity and time-critical.
references:
  - https://attack.mitre.org/techniques/T1490/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1490/T1490.md
author: Kanishk Singh
date: 2026/07/10
tags:
  - attack.impact
  - attack.t1490
logsource:
  product: windows
  category: process_creation
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  selection_wmic:
    Image|endswith: '\WMIC.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  selection_wbadmin:
    Image|endswith: '\wbadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'catalog'
  selection_bcdedit:
    Image|endswith: '\bcdedit.exe'
    CommandLine|contains:
      - 'recoveryenabled no'
      - 'bootstatuspolicy ignoreallfailures'
  condition: 1 of selection_*
falsepositives:
  - Rare. Some backup products prune shadow copies; these are known and scheduled.
    Any interactive vssadmin delete on a workstation warrants immediate triage.
level: critical
