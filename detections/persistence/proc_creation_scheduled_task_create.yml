title: Suspicious Scheduled Task Creation via schtasks
id: 6f2a1b30-9a1e-4c8d-9d21-0a1b2c3d4e08
status: experimental
description: >
  Detects creation of a scheduled task (schtasks /create) whose action runs a
  script interpreter, an encoded command, a binary staged in a user-writable
  directory, or runs as SYSTEM. Scheduled tasks are a durable persistence and
  privilege-escalation mechanism; keying on the action's content suppresses the
  large volume of benign task creation.
references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1053.005/T1053.005.md
author: Kanishk Singh
date: 2026/07/10
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_base:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: ' /create'
  selection_susp:
    CommandLine|contains:
      - 'powershell'
      - 'pwsh'
      - 'cmd /c'
      - 'cmd.exe /c'
      - 'mshta'
      - 'wscript'
      - 'cscript'
      - 'rundll32'
      - 'regsvr32'
      - ' -enc'
      - '\appdata\'
      - '\temp\'
      - '\programdata\'
      - '/ru system'
  condition: selection_base and selection_susp
falsepositives:
  - Software installers create tasks that call helpers in ProgramData. Confirm the
    task action binary is signed and expected.
level: medium
