title: Windows Event Log Cleared
id: 6f2a1b30-9a1e-4c8d-9d21-0a1b2c3d4e10
status: stable
description: >
  Detects clearing of Windows event logs via wevtutil (cl/clear-log) or the
  PowerShell Clear-EventLog / Remove-EventLog cmdlets. Wiping logs is an
  anti-forensics step used to destroy evidence of prior activity and almost never
  has a legitimate cause on production systems.
references:
  - https://attack.mitre.org/techniques/T1070/001/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1070.001/T1070.001.md
author: Kanishk Singh
date: 2026/07/10
tags:
  - attack.defense_evasion
  - attack.t1070.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_wevtutil:
    Image|endswith: '\wevtutil.exe'
    CommandLine|contains:
      - ' cl '
      - ' clear-log'
  selection_powershell:
    CommandLine|contains:
      - 'Clear-EventLog'
      - 'Remove-EventLog'
      - '.ClearEventLog('
  condition: 1 of selection_*
falsepositives:
  - Very rare. Some backup or imaging workflows clear logs; these should be known
    and change-managed.
level: high
