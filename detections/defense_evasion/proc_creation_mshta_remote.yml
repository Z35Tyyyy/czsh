title: Mshta Executing Remote or Inline Script
id: 6f2a1b30-9a1e-4c8d-9d21-0a1b2c3d4e11
status: experimental
description: >
  Detects mshta.exe (a signed Microsoft binary) being used to proxy execution of a
  remote payload (http/https) or inline script (javascript:/vbscript:). This is a
  well-worn signed-binary-proxy-execution technique that lets attackers run code
  while blending in with a trusted system binary. Local .hta launches from trusted
  directories are intentionally out of scope to limit noise.
references:
  - https://attack.mitre.org/techniques/T1218/005/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1218.005/T1218.005.md
author: Kanishk Singh
date: 2026/07/10
tags:
  - attack.defense_evasion
  - attack.t1218.005
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\mshta.exe'
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'javascript:'
      - 'vbscript:'
      - 'about:'
  condition: selection
falsepositives:
  - Legacy line-of-business HTA applications hosted internally. Allow-list the
    specific URL or file path if the app is known-good.
level: high
